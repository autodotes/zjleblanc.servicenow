---
- name: "Insert | query for existing {{ record.type }}"
  register: _records_api_query
  servicenow.itsm.api_info:
    resource: "{{ record.type }}"
    sysparm_query: "{{ record.exists_query | default('name=' + record.data.name) }}"

- name: "Insert | add new {{ record.type }}"
  when: not (_records_api_query.record | length)
  register: _records_insert
  servicenow.itsm.api:
    resource: "{{ record.type }}"
    action: post
    data: "{{ record.data }}"

- name: "Insert | update existing {{ record.type }}"
  when: _records_api_query.record | length
  register: _records_update
  servicenow.itsm.api:
    resource: "{{ record.type }}"
    action: patch
    sys_id: "{{ _records_api_query.record[0].sys_id }}"
    data: "{{ record.data }}"

- name: Insert | set internal record var
  ansible.builtin.set_fact:
    _records_current: "{ '{{ record.type }}': {{ snow_records_out[record.type] | default([]) + [_records_insert.record | default(_records_update.record)] }} }"

- name: Insert | update external records vars # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    snow_records_out: "{{ snow_records_out | default({}) | combine(_records_current) }}"
